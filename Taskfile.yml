version: '3'

vars:
  IMAGE: ghcr.io/openserbia/postgres-wolfi
  # Default major; override per invocation, e.g. `task ci PG_MAJOR=17`.
  # CI drives one major per matrix leg this way.
  PG_MAJOR: '18'
  # Image ref that scan/sbom/smoke operate on. Defaults to the locally-built
  # :PG_MAJOR-latest; CI overrides it per arch leg, e.g.
  # `task scan sbom smoke REF=$IMAGE:18-arm64`.
  REF: '{{.IMAGE}}:{{.PG_MAJOR}}-latest'

tasks:
  build:
    desc: Build the image (:PG_MAJOR-latest)
    cmds:
      - docker build --build-arg PG_MAJOR={{.PG_MAJOR}} -t {{.IMAGE}}:{{.PG_MAJOR}}-latest .

  scan:
    desc: Trivy — fail on CRITICAL or a non-Wolfi report, print HIGH
    cmds:
      - ./scripts/trivy-gate.sh '{{.REF}}'

  sbom:
    desc: Generate CycloneDX SBOM
    cmds:
      - syft {{.REF}} -o cyclonedx-json=sbom.cdx.json

  smoke:
    desc: Smoke-test the built image (asserts server major == PG_MAJOR)
    cmds:
      - ./test/smoke.sh {{.REF}} {{.PG_MAJOR}}

  lint:
    desc: shellcheck, Trivy gate fixtures, hadolint
    cmds:
      - ./scripts/lint.sh

  ci:
    desc: lint -> build -> scan -> sbom -> smoke (no push)
    cmds:
      - task: lint
      - task: build
      - task: scan
      - task: sbom
      - task: smoke

  default:
    cmds:
      - task -l

name: lint

on:
  push:
    branches: [main]
    # paths-ignore on push ONLY. pull_request stays unfiltered so every PR is
    # always linted — keeps `lint` safe to use as a required status check (a
    # path-filtered required check leaves doc-only PRs with no status and blocks
    # the merge). Nothing below can affect shellcheck (test/*.sh, scripts/*.sh)
    # or hadolint (Dockerfile) or the CI helper scripts (.github/scripts/*.sh),
    # so doc/meta-only pushes to main skip linting.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.idea/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linters are run as plain CLIs (shellcheck preinstalled; hadolint pulled by
# pinned release URL) rather than via marketplace tool-wrapper actions — same
# philosophy as build.yml: fewer third-party actions, nothing we don't control.
jobs:
  lint:
    runs-on: ubuntu-latest   # GitHub-hosted — NOT a self-hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        # shellcheck is preinstalled on ubuntu-latest runners.
        # docker-entrypoint.sh is intentionally NOT linted: it is vendored
        # verbatim from docker-library/postgres and must never be hand-edited.
        run: shellcheck test/*.sh scripts/*.sh .github/scripts/*.sh

      - name: hadolint
        # Pinned hadolint release binary, verified against its pinned sha256
        # before it runs (a swapped release asset fails here instead of executing).
        # Bump both lines together; the digest is on the release's asset list.
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/$HADOLINT_VERSION/hadolint-linux-x86_64"
          echo "$HADOLINT_SHA256  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint ./Dockerfile

name: build

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC — ALWAYS rebuilds (see note below)
  workflow_dispatch:
  push:
    branches: [main]
    # paths-ignore is scoped to `push` ONLY. GitHub never applies path filters to
    # `schedule` or `workflow_dispatch`, so the weekly cron rebuild (the channel
    # that pulls fresh Wolfi security patches) and manual runs ALWAYS build,
    # regardless of what changed. Everything below is doc/meta that cannot alter
    # the produced image or its scan/smoke gates, so a commit touching only these
    # skips the 6-leg matrix.
    paths-ignore:
      - '**/*.md'          # README, CHANGELOG, CONTRIBUTING, SECURITY, docs/*.md, …
      - 'docs/**'          # non-md docs assets
      - 'LICENSE'
      - '.gitignore'
      - '.idea/**'

# Top-level is read-only; write scopes (packages/id-token) are granted per-job to
# only the jobs that push/sign — least privilege. The `setup` job inherits this
# read-only default (it just computes a date). Keeps Scorecard Token-Permissions
# at 10/10 and stops `setup` from holding GHCR/OIDC write for nothing.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a partway-pushed run

env:
  IMAGE: ghcr.io/openserbia/postgres-wolfi

# Tooling (trivy, syft, cosign, go-task) comes from the repo's devbox.json via
# `devbox run` on the self-hosted runners — NOT from marketplace tool-wrapper
# actions. trivy-action was dropped because it internally pins
# aquasecurity/setup-trivy by a tag we don't control, which broke when upstream
# retagged it. Running the CLIs directly is race-proof and cuts four third-party
# actions.
#
# Multi-version × multi-arch:
#   - `build`    fans out over majors (16/17/18) × arches (amd64/arm64). Each leg
#                builds NATIVELY on a self-hosted runner of its arch — routed by
#                GitHub's built-in `X64` / `ARM64` labels — scans + smokes on that
#                real hardware, then pushes a per-arch tag and signs/attests it by
#                digest. Scan/smoke gate the push, so a bad arch publishes nothing.
#   - `manifest` stitches each major's two arch images into the public multi-arch
#                lists (:NN-latest rolling, :NN-YYYYMMDD immutable) and signs the
#                list (index) digest. Per-arch children are already signed +
#                SBOM-attested by the build job. It composes the list BY DIGEST,
#                from digest artifacts that only exist when a leg fully passed,
#                and refuses to publish a major missing either arch — so a
#                manifest list can never mix arches across runs or commits.
jobs:
  setup:
    # One shared date for the whole run, so the arch legs and the manifest job
    # can't disagree across a midnight UTC rollover.
    runs-on: [self-hosted, X64]
    outputs:
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Compute date tag
        id: meta
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    permissions:
      contents: read       # checkout
      packages: write      # push per-arch tag to GHCR
      id-token: write      # cosign keyless OIDC
    strategy:
      fail-fast: false             # one major/arch failing must not abort the others
      matrix:
        # Add "19" the day Wolfi publishes postgresql-19 (PG19 GA ~autumn 2026);
        # until then `apk add postgresql-19` 404s, so it stays out to avoid a
        # perma-red leg.
        pg: ["16", "17", "18"]
        arch: ["amd64", "arm64"]
        include:
          # Route each arch to a matching self-hosted runner via GitHub's
          # built-in arch labels — no infra-specific runner names.
          - arch: amd64
            runner: X64
          - arch: arm64
            runner: ARM64
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    env:
      PG_MAJOR: ${{ matrix.pg }}
      ARCH: ${{ matrix.arch }}
      DATE: ${{ needs.setup.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Native single-arch build: the runner's hardware arch == matrix.arch, so a
      # plain `docker build` already produces the correct arch (no buildx/QEMU).
      # Tagged with an -ARCH suffix; the manifest job assembles these into the
      # public :NN-latest / :NN-DATE multi-arch lists.
      - name: Build
        run: |
          docker build \
            --build-arg PG_MAJOR="$PG_MAJOR" \
            -t "$IMAGE:$PG_MAJOR-$DATE-$ARCH" \
            .

      - name: Scan (CRITICAL gate) + SBOM + smoke
        run: devbox run -- task scan sbom smoke PG_MAJOR="$PG_MAJOR" REF="$IMAGE:$PG_MAJOR-$DATE-$ARCH"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.pg }}-${{ matrix.arch }}
          path: sbom.cdx.json
          retention-days: 1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Read the digest back from the REGISTRY (not from local `docker inspect
      # .RepoDigests`, which is a local-daemon cache that can hold entries from
      # earlier pushes). This is the authoritative identity of what we just
      # published, and it is what both cosign and the manifest job consume.
      - name: Push (per-arch tag)
        id: push
        run: |
          docker push "$IMAGE:$PG_MAJOR-$DATE-$ARCH"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$PG_MAJOR-$DATE-$ARCH" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/$ARCH"

      - name: Sign + attest per-arch (by digest, via devbox cosign)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "signing $IMAGE@$DIGEST"
          devbox run -- cosign sign --yes "$IMAGE@$DIGEST"
          devbox run -- cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"

      # LAST step of the leg, deliberately. Steps only run when every preceding
      # step succeeded, so the mere EXISTENCE of this artifact certifies that this
      # (major, arch) passed the CRITICAL scan + smoke gate, pushed, and was signed
      # and SBOM-attested. The manifest job treats it as exactly that success
      # token: no artifact -> no manifest list for that major. Uploading it right
      # after `docker push` would instead let a leg that failed `cosign sign` feed
      # an unsigned child into the published list.
      - name: Upload digest (manifest input / leg success token)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.pg }}-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: [setup, build]
    permissions:
      contents: read
      packages: write      # push manifest list to GHCR
      id-token: write      # cosign sign index
    # Run even if some build legs failed (fail-fast: false leaves the rest green),
    # so a healthy major still publishes when a sibling major is broken. This
    # matrix's own leg for a major fails closed unless BOTH of that major's arch
    # legs uploaded a digest artifact this run — see "Assert both arches passed".
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: [self-hosted, X64]
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    env:
      PG_MAJOR: ${{ matrix.pg }}
      DATE: ${{ needs.setup.outputs.date }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull in the digest artifacts uploaded by THIS run's build legs. Each file
      # is named after its arch and holds that leg's registry digest. A leg that
      # failed anywhere (scan gate, push, sign, attest) uploaded nothing, so its
      # file is simply absent — which the next step turns into a hard failure.
      - name: Download per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digest-${{ matrix.pg }}-*
          merge-multiple: true
          path: digests

      # Fail closed. Previously this job composed the list from the per-arch TAGS
      # (:NN-DATE-amd64 / -arm64), which made the gate a no-op on any same-day
      # re-run: DATE has day granularity, so an earlier run's tags were still
      # sitting in the registry and imagetools happily resolved them. A run whose
      # arm64 legs failed the CRITICAL gate could therefore still publish
      # :NN-latest as {fresh amd64 from this commit} + {stale arm64 from an
      # earlier commit} — a manifest list whose two architectures came from
      # different sources, reported green. Observed in run 30256361638 (2026-07-27),
      # where 17-arm64 and 18-arm64 failed yet manifest (17)/(18) both succeeded.
      - name: Assert both arches passed this run
        run: |
          for arch in amd64 arm64; do
            if [ ! -s "digests/$arch" ]; then
              echo "::error::PG $PG_MAJOR: no digest recorded for linux/$arch in this run — that build leg did not fully pass. Refusing to publish a manifest list."
              exit 1
            fi
          done

      # Assemble the per-arch images into the public multi-arch manifest lists,
      # addressing the children BY DIGEST so the list can only ever contain images
      # this run built, scanned, pushed and signed. Both the rolling and the dated
      # tag point at the same index.
      - name: Create + push manifest lists
        run: |
          AMD64_DIGEST=$(cat digests/amd64)
          ARM64_DIGEST=$(cat digests/arm64)
          echo "PG $PG_MAJOR: amd64=$AMD64_DIGEST arm64=$ARM64_DIGEST"
          docker buildx imagetools create \
            -t "$IMAGE:$PG_MAJOR-latest" \
            -t "$IMAGE:$PG_MAJOR-$DATE" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"

      # Sign the manifest-list (index) digest, so `cosign verify :NN-latest`
      # (which resolves to the index) passes. Per-arch children were already
      # signed + SBOM-attested in the build job.
      - name: Sign manifest list (by digest, via devbox cosign)
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$PG_MAJOR-$DATE" --format '{{.Manifest.Digest}}')
          echo "signing index $IMAGE@$DIGEST"
          devbox run -- cosign sign --yes "$IMAGE@$DIGEST"
